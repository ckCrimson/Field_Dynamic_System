[project]
name = "field-dynamic-system"
version = "0.1.0"
description = "FDS Framework"
authors = [
    {name = "Aditya", email = "ak7004271114@gmail.com"}
]
readme = "README.md"
requires-python = "^3.10"

# CHANGE 1: I added your libraries here.
dependencies = [
    "jax==0.4.28",
    "jaxlib==0.4.28",
    "numpy<2.0"
]

# CHANGE 2: This section tells Poetry to look inside the 'src' folder
[tool.poetry]
packages = [{include = "field_dynamic_system", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.14.10,<0.15.0)",
    "mypy (>=1.19.1,<2.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "mkdocs-material (>=9.7.1,<10.0.0)",
    "mkdocstrings-python (>=2.0.1,<3.0.0)",
    "jupyter (>=1.1.1,<2.0.0)",
    "ipykernel (>=7.1.0,<8.0.0)"
]